<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <!--
    EYAN mark: a capital E rendered as a 7-segment display digit, the kind
    of readout on a VU meter, timecode window, or digital clock in a
    broadcast rack. Segments a/f/g/e/d are lit (forming the E); b/c on the
    right are drawn "unlit" the way a real display shows its unused
    segments, rather than simply omitted. Colors match the app's own
    phosphor/amber tokens exactly: this is a re-skin of an existing
    tool's identity, not a from-scratch palette.
  -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="100" height="160" rx="18" fill="#0b1220"/>

  <!-- unlit segments (b, c: right side) -->
  <g fill="none" stroke="#1c2740" stroke-width="2">
    <rect x="68" y="10" width="14" height="70" rx="6"/>
    <rect x="68" y="80" width="14" height="70" rx="6"/>
  </g>

  <!-- lit segments (a, f, g, e, d) forming the E, with phosphor glow -->
  <g fill="#34e6c5" filter="url(#glow)">
    <rect x="18" y="10"  width="64" height="14" rx="6"/>  <!-- a: top -->
    <rect x="18" y="10"  width="14" height="70" rx="6"/>  <!-- f: upper-left -->
    <rect x="18" y="73"  width="64" height="14" rx="6"/>  <!-- g: middle -->
    <rect x="18" y="80"  width="14" height="70" rx="6"/>  <!-- e: lower-left -->
    <rect x="18" y="136" width="64" height="14" rx="6"/>  <!-- d: bottom -->
  </g>

  <!-- power/status dot, amber: the one warm accent against all that phosphor teal -->
  <circle cx="82" cy="146" r="4.5" fill="#ffb545"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <!--
    AIMP mark: a capital A rendered as a 7-segment display digit, the same
    broadcast-rack readout style as before (this app was called EYAN when
    that version shipped, hence the old mark being a segment "E"; this is
    the same visual language re-lettered for AIMP, not a new style).
    Segments a/f/b/g/e/c are lit (forming the A); d (bottom) is drawn
    "unlit" the way a real display shows its unused segments, rather than
    simply omitted. This is also just the built-in default now; see
    Config > Branding to replace it with your own logo without touching
    this file.
  -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="100" height="160" rx="18" fill="#0b1220"/>

  <!-- unlit segment (d: bottom) -->
  <g fill="none" stroke="#1c2740" stroke-width="2">
    <rect x="18" y="136" width="64" height="14" rx="6"/>
  </g>

  <!-- lit segments (a, f, b, g, e, c) forming the A, with phosphor glow -->
  <g fill="#34e6c5" filter="url(#glow)">
    <rect x="18" y="10"  width="64" height="14" rx="6"/>  <!-- a: top -->
    <rect x="18" y="10"  width="14" height="70" rx="6"/>  <!-- f: upper-left -->
    <rect x="68" y="10"  width="14" height="70" rx="6"/>  <!-- b: upper-right -->
    <rect x="18" y="73"  width="64" height="14" rx="6"/>  <!-- g: middle -->
    <rect x="18" y="80"  width="14" height="70" rx="6"/>  <!-- e: lower-left -->
    <rect x="68" y="80"  width="14" height="70" rx="6"/>  <!-- c: lower-right -->
  </g>

  <!-- power/status dot, amber: the one warm accent against all that phosphor teal -->
  <circle cx="82" cy="146" r="4.5" fill="#ffb545"/>
</svg>

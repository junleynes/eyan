<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130">
  <!--
    Full AIMP lockup: the 7-segment "A" mark (see logo-mark.svg) plus
    wordmark and tagline. Self-contained dark background so this reads
    correctly wherever it's dropped: a GitHub README on a white page,
    not just the app's own already-dark UI.
  -->
  <defs>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="130" rx="16" fill="#0b1220"/>

  <!-- icon (scaled-down copy of logo-mark.svg's segment art) -->
  <g transform="translate(22,15) scale(0.625)">
    <g fill="none" stroke="#1c2740" stroke-width="2">
      <rect x="18" y="136" width="64" height="14" rx="6"/>
    </g>
    <g fill="#34e6c5" filter="url(#glow2)">
      <rect x="18" y="10"  width="64" height="14" rx="6"/>
      <rect x="18" y="10"  width="14" height="70" rx="6"/>
      <rect x="68" y="10"  width="14" height="70" rx="6"/>
      <rect x="18" y="73"  width="64" height="14" rx="6"/>
      <rect x="18" y="80"  width="14" height="70" rx="6"/>
      <rect x="68" y="80"  width="14" height="70" rx="6"/>
    </g>
    <circle cx="82" cy="146" r="4.5" fill="#ffb545"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="112" y="70" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace"
        font-size="46" font-weight="700" letter-spacing="4" fill="#e7edf6">AIMP</text>
  <text x="114" y="93" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace"
        font-size="13" font-weight="500" letter-spacing="2.5" fill="#ffb545">AI MEDIA PROVIDER</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-labelledby="title desc">
  <title id="title">AIMP — AI Media Platform</title>
  <desc id="desc">Modern AIMP wordmark with an AI sparkle</desc>
  <defs>
    <linearGradient id="a" x1="24" y1="16" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62ffe2"/><stop offset=".55" stop-color="#34e6c5"/><stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="spark" x1="330" y1="15" x2="390" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".45" stop-color="#ffcf70"/><stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="420" height="120" rx="26" fill="#0b1220"/>

  <!-- Clean AIMP wordmark. No separate AR monogram. -->
  <g fill="none" stroke="url(#a)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 88 58 22l27 66M41 64h34"/>
  </g>
  <g fill="#f3f7fb" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="5">
    <text x="103" y="82" font-size="55">IMP</text>
  </g>
  <!-- AI sparkle -->
  <g fill="url(#spark)" filter="url(#glow)">
    <path d="M365 17l5 15 15 5-15 5-5 15-5-15-15-5 15-5z"/>
    <path d="M327 57l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
  </g>
  <circle cx="393" cy="91" r="4" fill="#34e6c5"/>
  <circle cx="381" cy="101" r="2.5" fill="#4f8cff"/>
</svg>

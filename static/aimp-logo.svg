<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-labelledby="title desc">
  <title id="title">AIMP</title>
  <desc id="desc">AIMP AI media platform logo</desc>
  <defs>
    <linearGradient id="p" x1="20" y1="12" x2="86" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34e6c5"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
